# Reusable full gate — the SINGLE source of truth for "is this green?". Both CI and
# the deploy workflows call this via `needs`, so a red suite can never skip a deploy.
name: test
on:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: mypy app
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  # End-to-end: the real SPA against the real backend (fresh sqlite, dev-auth shim,
  # local-only stub PDF renderer). Playwright boots both servers itself.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps (system python — serve-backend.mjs uses E2E_PYTHON)
        working-directory: backend
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: frontend
        env:
          CI: "true"            # -> reuseExistingServer:false (always fresh servers)
          E2E_PYTHON: python    # system python (deps installed above), not the local venv
        run: npm run e2e
