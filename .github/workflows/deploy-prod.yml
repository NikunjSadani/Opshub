# Prod deploy — MANUAL only. The single deliberate trigger IS the approval (WoW #8):
# nothing auto-deploys. To ship prod: Actions → "Deploy prod" → Run workflow (defaults
# to the develop HEAD, which is the release branch; pick another ref to deploy it).
#
# NOTE: a real "required-reviewer" pause needs GitHub Pro/Team on a private repo — not on
# this plan — so the gate here is the manual dispatch, not an approval prompt (same as the
# loyalty repo, whose `production` environment has no reviewer rule either). The bare
# `environment: production` below only scopes/labels the deployment; if the plan is ever
# upgraded, adding a required reviewer to that environment turns this into a click-approve
# pause with no workflow change.
#
# Wired: WIF via secrets WIF_PROVIDER + DEPLOY_SA (Workload Identity, no key file);
# var GCP_PROJECT_ID_PROD=opshub-506704.
name: Deploy prod
on:
  workflow_dispatch: {}

env:
  REGION: asia-south1
  SERVICE: opshub-api
  MIGRATE_JOB: opshub-migrate
  AR_REPO: opshub

jobs:
  test:
    uses: ./.github/workflows/_test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production # labels/scopes the deployment; add a reviewer here if plan upgraded
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_PROD }}/${AR_REPO}/api:prod-${GITHUB_SHA::7}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Migrate (in-VPC job, --wait)
        run: |
          gcloud run jobs update "$MIGRATE_JOB" --image "$IMAGE" \
            --region "$REGION" --project "${{ vars.GCP_PROJECT_ID_PROD }}"
          gcloud run jobs execute "$MIGRATE_JOB" --wait \
            --region "$REGION" --project "${{ vars.GCP_PROJECT_ID_PROD }}"

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" \
            --region "$REGION" --project "${{ vars.GCP_PROJECT_ID_PROD }}"

      - name: Verify serving image SHA
        run: |
          SERVING=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" --project "${{ vars.GCP_PROJECT_ID_PROD }}" \
            --format='value(spec.template.spec.containers[0].image)')
          echo "serving: $SERVING"
          echo "$SERVING" | grep -q "prod-${GITHUB_SHA::7}"
