name = "opshub-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"
workers_dev = false

# Bind ONLY opshub.gifsy.in to this worker. This host pattern has no wildcard, so it is more
# specific than the loyalty zone's `*.gifsy.in/*` route and wins for opshub.gifsy.in — while
# every other *.gifsy.in host continues to go to the loyalty worker untouched.
#
# PREREQUISITE (Cloudflare dashboard): a PROXIED (orange-cloud) DNS record for `opshub` in the
# gifsy.in zone. CNAME opshub -> opshub-api-2aadkzwkua-el.a.run.app (Proxied). Edge TLS for
# opshub.gifsy.in is already covered by the zone's *.gifsy.in Universal SSL certificate.
routes = [
  { pattern = "opshub.gifsy.in/*", zone_name = "gifsy.in" },
]
